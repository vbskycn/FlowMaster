name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n backup_vnstat.sh
          bash -n test/backup-vnstat-lifecycle.test.sh
          bash -n test/install-linux.test.sh
          bash -n test/pm2-recovery-systemd.test.sh
      - name: Test Linux installer safeguards
        run: |
          bash test/backup-vnstat-lifecycle.test.sh
          bash test/install-linux.test.sh
      - name: Test
        run: npm run test:ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
